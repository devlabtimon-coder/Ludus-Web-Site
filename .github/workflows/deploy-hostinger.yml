# Publica o painel na Hostinger a cada push na main: gera o build com as variáveis do repositório e grava
# o resultado na branch deploy-hostinger. O Git da Hostinger (hPanel › Avançado › Git) puxa essa branch para a
# pasta do subdomínio ludus-admin.cocaistech.com, avisado pelo webhook de implantação automática.
#
# Configuração (GitHub › Settings › Secrets and variables › Actions › Variables):
#   VITE_API_URL, VITE_GOOGLE_CLIENT_ID, VITE_IFMA_MODE
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sem a URL da API o painel abre mas não fala com o servidor: melhor falhar aqui do que publicar quebrado.
      - name: Conferir variáveis do build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL" || { echo "::error::Defina a variável VITE_API_URL no repositório"; exit 1; }

      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_IFMA_MODE: ${{ vars.VITE_IFMA_MODE }}

      # Um commit só, sem histórico: a branch guarda apenas o build mais recente.
      - name: Gravar o build na branch deploy-hostinger
        working-directory: dist
        run: |
          git init -q -b deploy-hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-hostinger
